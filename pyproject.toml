[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshift-ai"
version = "0.1.0"
description = "CLI que migra projetos Python para C++ usando IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
    "openai",
    "WatchGuardian",
]

[project.optional-dependencies]
# modelo local (sem servidor OpenAI-compatível); pesado por causa do torch
local = ["transformers", "torch"]

# Só o CLI é exposto: não há API pública para import, apenas o comando.
[project.scripts]
codeshift = "_codeshift.cli:main"

[tool.setuptools.packages.find]
include = ["_codeshift*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"_codeshift.prompt" = ["*.md"]
